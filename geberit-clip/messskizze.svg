<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#c00"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#2a8a2a"/></marker></defs>
<rect width="1200" height="900" fill="#fff"/><rect x="10" y="10" width="1180" height="880" fill="none" stroke="#000" stroke-width="2"/>
<text x="600" y="55" font-size="26" font-weight="bold" text-anchor="middle">Messskizze – Klickring auf dem Wulst Ø 30</text>
<text x="600" y="85" font-size="16" text-anchor="middle" fill="#555">Rohr liegend wie auf Ihrem Foto · nicht maßstäblich</text>

<!-- Rohr -->
<rect x="60" y="280" width="600" height="240" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
<!-- Wulst mit Schlitzen -->
<rect x="300" y="255" width="40" height="290" fill="#dcdcdc" stroke="#000" stroke-width="2"/>
<line x1="320" y1="255" x2="320" y2="300" stroke="#000" stroke-width="2"/><line x1="320" y1="500" x2="320" y2="545" stroke="#000" stroke-width="2"/>
<text x="255" y="245" font-size="15" text-anchor="end" fill="#555">Wulst mit Schlitzen →</text>
<line x1="40" y1="400" x2="690" y2="400" stroke="#555" stroke-dasharray="12 4 2 4"/>
<text x="150" y="440" font-size="17" text-anchor="middle" fill="#777">Rohr</text>
<text x="540" y="440" font-size="17" text-anchor="middle" fill="#777">Rohr</text>

<!-- Ring mit Innennut (blau, gestrichelt) -->
<path d="M270,280 L270,200 L400,200 L400,280 L345,280 L345,252 L295,252 L295,280 Z" fill="#9cc0ff" fill-opacity="0.5" stroke="#1a5fd0" stroke-width="2" stroke-dasharray="6 3"/>
<path d="M270,520 L270,600 L400,600 L400,520 L345,520 L345,548 L295,548 L295,520 Z" fill="#9cc0ff" fill-opacity="0.5" stroke="#1a5fd0" stroke-width="2" stroke-dasharray="6 3"/>
<text x="335" y="228" font-size="16" fill="#1a5fd0" font-weight="bold" text-anchor="middle">neuer Ring</text>
<text x="335" y="585" font-size="14" fill="#1a5fd0" text-anchor="middle">Nut im Ring</text>

<!-- W -->
<line x1="320" y1="305" x2="320" y2="495" stroke="#2a8a2a" stroke-width="2"/>
<line x1="330" y1="255" x2="330" y2="545" stroke="#2a8a2a" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>
<text x="345" y="380" font-size="20" font-weight="bold" fill="#2a8a2a">W = Ø 30 ✓</text>
<!-- S -->
<line x1="560" y1="280" x2="560" y2="520" stroke="#c00" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="572" y="480" font-size="20" font-weight="bold" fill="#c00">S</text>
<!-- B Wulstbreite -->
<line x1="300" y1="660" x2="300" y2="610" stroke="#c00"/><line x1="340" y1="660" x2="340" y2="610" stroke="#c00"/>
<line x1="300" y1="660" x2="340" y2="660" stroke="#c00" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="320" y="690" font-size="20" font-weight="bold" fill="#c00" text-anchor="middle">B</text>
<!-- D -->
<line x1="430" y1="200" x2="430" y2="600" stroke="#c00" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="400" y1="200" x2="440" y2="200" stroke="#c00"/><line x1="400" y1="600" x2="440" y2="600" stroke="#c00"/>
<text x="442" y="320" font-size="20" font-weight="bold" fill="#c00">D</text>
<!-- H -->
<line x1="270" y1="160" x2="400" y2="160" stroke="#c00" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="270" y1="150" x2="270" y2="200" stroke="#c00"/><line x1="400" y1="150" x2="400" y2="200" stroke="#c00"/>
<text x="335" y="148" font-size="20" font-weight="bold" fill="#c00" text-anchor="middle">H</text>

<!-- Tabelle -->
<g font-size="17">
<text x="720" y="150" font-size="22" font-weight="bold">Maße eintragen</text>
<rect x="720" y="165" width="450" height="236" fill="none" stroke="#000"/>
<g stroke="#000"><line x1="720" y1="212" x2="1170" y2="212"/><line x1="720" y1="259" x2="1170" y2="259"/><line x1="720" y1="306" x2="1170" y2="306"/><line x1="720" y1="353" x2="1170" y2="353"/><line x1="1060" y1="165" x2="1060" y2="401"/></g>
<text x="735" y="195" fill="#2a8a2a" font-weight="bold">W  Ø Wulst</text><text x="1075" y="195" fill="#2a8a2a" font-weight="bold">30 mm</text>
<text x="735" y="242" fill="#c00" font-weight="bold">S  Ø Rohr neben Wulst</text><text x="1075" y="242">___ mm</text>
<text x="735" y="289" fill="#c00" font-weight="bold">B  Breite Wulst</text><text x="1075" y="289">___ mm</text>
<text x="735" y="336" fill="#c00" font-weight="bold">D  Ø außen Ring</text><text x="1075" y="336">___ mm</text>
<text x="735" y="383" fill="#c00" font-weight="bold">H  Höhe Ring</text><text x="1075" y="383">___ mm</text>
</g>
<g font-size="16" fill="#333">
<text x="720" y="450" font-weight="bold" font-size="18">So messen:</text>
<text x="720" y="478">S  Rohr direkt neben dem Wulst = Bohrung des Rings</text>
<text x="745" y="500">(beide Seiten messen, kleineren Wert nehmen)</text>
<text x="720" y="528">B  Breite des Wulsts in Längsrichtung = Nutbreite</text>
<text x="720" y="556">D  &gt; 35 mm, wenn der Ring die Hülse Ø 35 stoppen soll;</text>
<text x="745" y="578">&lt; 35 mm, wenn er in die Hülse hineinpassen muss</text>
<text x="720" y="606">H  gewünschte Ringhöhe (eBay-Foto: ca. 5–8 mm)</text>
</g>
<text x="600" y="780" font-size="17" text-anchor="middle" fill="#1a5fd0">Ring über das Rohr schieben – der geschlitzte Wulst federt ein und schnappt in die Nut im Ring.</text>
<text x="600" y="812" font-size="16" text-anchor="middle" fill="#555">Aktuell im Modell geschätzt: S 28,5 · B 2,5 · D 40 · H 6 – Maße zurückmelden, dann wird das Modell angepasst.</text>
</svg>
