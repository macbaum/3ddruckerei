<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#c00"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#2a8a2a"/></marker></defs>
<rect width="1200" height="900" fill="#fff"/><rect x="10" y="10" width="1180" height="880" fill="none" stroke="#000" stroke-width="2"/>
<text x="600" y="55" font-size="26" font-weight="bold" text-anchor="middle">Messskizze – Nut am Rohr Ø 30 (Klickring)</text>
<text x="600" y="85" font-size="16" text-anchor="middle" fill="#555">Rohr liegend wie auf Ihrem Foto · links Richtung Glocke/Hülse Ø 35 · nicht maßstäblich</text>

<!-- Rohr Ø26 links -->
<rect x="60" y="300" width="190" height="200" fill="#f4f4f4" stroke="#000" stroke-width="2"/>
<text x="155" y="440" font-size="17" text-anchor="middle" fill="#777">Rohr Ø 26</text>
<!-- Rohr Ø30 mit Wulst und Nut: obere Kontur -->
<path d="M250,270 L250,250 L290,250 L290,270 L330,270 L330,250 L640,250 L640,550 L330,550 L330,530 L290,530 L290,550 L250,550 L250,530 Z" fill="#e9e9e9" stroke="#000" stroke-width="2"/>
<text x="640" y="470" font-size="18" text-anchor="middle" fill="#555">Rohr Ø 30</text>
<text x="270" y="232" font-size="14" text-anchor="middle" fill="#555">Wulst</text>
<text x="310" y="300" font-size="14" text-anchor="middle" fill="#555">Nut</text>
<line x1="40" y1="400" x2="680" y2="400" stroke="#555" stroke-dasharray="12 4 2 4"/>

<!-- Ring (blau, gestrichelt eingezeichnet) -->
<path d="M282,250 L282,190 L410,190 L410,250 Z" fill="#9cc0ff" fill-opacity="0.45" stroke="#1a5fd0" stroke-width="2" stroke-dasharray="6 3"/>
<path d="M282,550 L282,610 L410,610 L410,550 Z" fill="#9cc0ff" fill-opacity="0.45" stroke="#1a5fd0" stroke-width="2" stroke-dasharray="6 3"/>
<text x="346" y="226" font-size="16" fill="#1a5fd0" font-weight="bold" text-anchor="middle">neuer Ring</text>

<!-- A -->
<line x1="560" y1="250" x2="560" y2="550" stroke="#2a8a2a" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>
<text x="575" y="345" font-size="20" font-weight="bold" fill="#2a8a2a">A = Ø 30 ✓</text>
<!-- N Nut-Ø -->
<line x1="310" y1="270" x2="310" y2="530" stroke="#c00" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="318" y="470" font-size="20" font-weight="bold" fill="#c00">N</text>
<!-- W Wulst-Ø -->
<line x1="270" y1="250" x2="270" y2="550" stroke="#c00" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="228" y="580" font-size="20" font-weight="bold" fill="#c00">W</text>
<!-- B Nutbreite -->
<line x1="290" y1="640" x2="290" y2="555" stroke="#c00"/><line x1="330" y1="640" x2="330" y2="555" stroke="#c00"/>
<line x1="290" y1="650" x2="330" y2="650" stroke="#c00" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="310" y="680" font-size="20" font-weight="bold" fill="#c00" text-anchor="middle">B</text>
<!-- E Wulstbreite -->
<line x1="250" y1="700" x2="250" y2="555" stroke="#c00"/>
<line x1="250" y1="710" x2="290" y2="710" stroke="#c00" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="270" y="740" font-size="20" font-weight="bold" fill="#c00" text-anchor="middle">E</text>
<!-- D Aussen-Ø Ring, H Hoehe Ring -->
<line x1="440" y1="190" x2="440" y2="610" stroke="#c00" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="410" y1="190" x2="450" y2="190" stroke="#c00"/><line x1="410" y1="610" x2="450" y2="610" stroke="#c00"/>
<text x="452" y="500" font-size="20" font-weight="bold" fill="#c00">D</text>
<line x1="282" y1="160" x2="410" y2="160" stroke="#c00" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="282" y1="150" x2="282" y2="190" stroke="#c00"/><line x1="410" y1="150" x2="410" y2="190" stroke="#c00"/>
<text x="346" y="148" font-size="20" font-weight="bold" fill="#c00" text-anchor="middle">H</text>

<!-- Tabelle -->
<g font-size="17">
<text x="720" y="150" font-size="22" font-weight="bold">Maße eintragen</text>
<rect x="720" y="165" width="450" height="330" fill="none" stroke="#000"/>
<g stroke="#000"><line x1="720" y1="212" x2="1170" y2="212"/><line x1="720" y1="259" x2="1170" y2="259"/><line x1="720" y1="306" x2="1170" y2="306"/><line x1="720" y1="353" x2="1170" y2="353"/><line x1="720" y1="400" x2="1170" y2="400"/><line x1="720" y1="447" x2="1170" y2="447"/><line x1="1060" y1="165" x2="1060" y2="495"/></g>
<text x="735" y="195" fill="#2a8a2a" font-weight="bold">A  Ø Rohr</text><text x="1075" y="195" fill="#2a8a2a" font-weight="bold">30 mm</text>
<text x="735" y="242" fill="#c00" font-weight="bold">N  Ø im Nutgrund</text><text x="1075" y="242">___ mm</text>
<text x="735" y="289" fill="#c00" font-weight="bold">B  Breite der Nut</text><text x="1075" y="289">___ mm</text>
<text x="735" y="336" fill="#c00" font-weight="bold">W  Ø Wulst (Rohrende)</text><text x="1075" y="336">___ mm</text>
<text x="735" y="383" fill="#c00" font-weight="bold">E  Breite Wulst</text><text x="1075" y="383">___ mm</text>
<text x="735" y="430" fill="#c00" font-weight="bold">D  Ø außen Ring (gewünscht)</text><text x="1075" y="430">___ mm</text>
<text x="735" y="477" fill="#c00" font-weight="bold">H  Höhe Ring (gewünscht)</text><text x="1075" y="477">___ mm</text>
</g>
<g font-size="16" fill="#333">
<text x="720" y="545" font-weight="bold" font-size="18">So messen:</text>
<text x="720" y="573">N  Messschieber in die Nut legen (dünne Schenkel)</text>
<text x="720" y="599">B  Nutbreite mit der Messschieber-Spitze,</text>
<text x="745" y="621">oder mit Bohrern/Fühlerlehre prüfen</text>
<text x="720" y="647">W, E  Wulst am Rohrende mit den Schlitzen</text>
<text x="720" y="673">D  größer als Ø 35 (Anschlag für die Hülse)</text>
<text x="745" y="695">oder kleiner (wenn er hineinpassen muss)?</text>
<text x="720" y="721">H  wie der Ring im eBay-Foto (ca. 5–8 mm)</text>
</g>
<text x="600" y="800" font-size="17" text-anchor="middle" fill="#1a5fd0">Der Ring hat innen eine Rippe (Ø N), die über den Wulst rutscht und in die Nut einklickt.</text>
<text x="600" y="830" font-size="16" text-anchor="middle" fill="#555">Aktuell im Modell geschätzt: N 28 · B 2 · D 40 · H 6 – Maße zurückmelden, dann wird das Modell angepasst.</text>
</svg>
